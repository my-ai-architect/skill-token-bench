[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-token-bench"
version = "0.1.0"
description = "Token-efficiency benchmark for agent skills, CLI intercepts, and memory tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Keith Webber" }]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
stb = "skill_token_bench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_token_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
